# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

  deploy:
    name: Deploy app
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      # The database credentials are runtime secrets, not build args, so they never end up in
      # the image. --stage applies them with the deploy below instead of restarting the app now.
      - name: Stage database secrets
        run: flyctl secrets set --stage ASTRO_DB_REMOTE_URL="$ASTRO_DB_REMOTE_URL" ASTRO_DB_APP_TOKEN="$ASTRO_DB_APP_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ASTRO_DB_REMOTE_URL: ${{ secrets.ASTRO_DB_REMOTE_URL }}
          ASTRO_DB_APP_TOKEN: ${{ secrets.ASTRO_DB_APP_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
